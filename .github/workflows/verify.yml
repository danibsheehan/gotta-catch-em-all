# Parallel PR/push verification jobs (format/lint/audit/test/build), via dani-actions'
# shared npm-verify.yml. Deploy lives in its own file (deploy-pages.yml) since it has a
# different trigger (push to main only) and different risk profile (side effects).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/npm-verify.yml@v17
    with:
      packages: |
        [{"name": "app", "path": ".",
          "test-command": "npm run test:ci",
          "build-command": "npx ng build --configuration production --base-href /${{ github.event.repository.name }}/",
          "coverage-file": "coverage/gotta-catch-em-all/cobertura-coverage.xml",
          "setup-chrome": true,
          "paths": "app:\n  - 'src/**'\n  - 'public/**'\n  - 'package.json'\n  - 'package-lock.json'\n  - 'angular.json'\n  - 'tsconfig*.json'\n  - 'eslint.config.*'\n  - '.prettierrc*'\n  - '.prettierignore'\n  - '.nvmrc'\n  - 'index.html'\n  - '.github/workflows/**'\n  - '.github/dependabot.yml'\n  - '.github/labeler.yml'"}]
