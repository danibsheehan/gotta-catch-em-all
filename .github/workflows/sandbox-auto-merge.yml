# Auto-merges only sandbox-backlog PRs labeled both `agent-sandbox` and `sandbox-tier-a`,
# once required checks (verify, battle-invariant-check) pass. See the sandbox exception in
# AGENTS.md and sandbox/sandbox-backlog.md. Gate is by label pair, not actor — the sandbox
# routine acts under a personal token, not a bot identity, so the label pair is the only
# reliable signal that a PR came from the sandbox backlog. Both labels are applied by the
# routine itself when it opens the PR; never apply them by hand.

name: Sandbox auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: |
      contains(github.event.pull_request.labels.*.name, 'agent-sandbox') &&
      contains(github.event.pull_request.labels.*.name, 'sandbox-tier-a')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
