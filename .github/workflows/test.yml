# Single shared quality gate (format/lint/audit/test/build) via dani-actions'
# npm-quality-gate.yml, matching musing/baseball-collection. Skips draft pull requests;
# docs/skills-only PRs skip lint/audit/test/build via app-paths (format:check always runs).

name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/npm-quality-gate.yml@v6
    with:
      test-command: npm run test:ci
      build-command: >-
        npx ng build --configuration production --base-href /${{ github.event.repository.name }}/
      setup-chrome: true
      coverage-file: coverage/gotta-catch-em-all/cobertura-coverage.xml
      app-paths: |
        app:
          - 'src/**'
          - 'public/**'
          - 'package.json'
          - 'package-lock.json'
          - 'angular.json'
          - 'tsconfig*.json'
          - 'eslint.config.*'
          - '.prettierrc*'
          - '.prettierignore'
          - '.nvmrc'
          - 'index.html'
          - '.github/workflows/**'
          - '.github/dependabot.yml'
          - '.github/labeler.yml'

  # Previously gated on both quality and unit-tests -- now just the single quality job.
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: danibsheehan/dani-actions/.github/workflows/deploy-github-pages.yml@v2
    with:
      build-command: >-
        npx ng build --configuration production --base-href /${{ github.event.repository.name }}/ &&
        touch dist/gotta-catch-em-all/browser/.nojekyll
      dist-path: dist/gotta-catch-em-all/browser
    secrets: inherit
