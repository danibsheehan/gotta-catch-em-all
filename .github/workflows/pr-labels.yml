# Applies area:* labels from changed paths. Non-blocking; separate from verify. Uses
# pull_request_target (not pull_request) since actions/labeler only calls the GitHub API to
# add labels -- it never checks out or executes PR code -- so pull_request_target safely
# also labels PRs from forks, unlike pull_request which can't see fork-diff paths with base
# permissions.

name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
