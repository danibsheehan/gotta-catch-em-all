# Audits a local production build (not the live site) with Lighthouse CI. Plain `npm run
# build` (no --base-href override) keeps the default root "/" base href from index.html,
# which is what lighthouse-ci-action's local static server expects.
name: Lighthouse CI

on: pull_request

jobs:
  lighthouse:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
    uses: danibsheehan/dani-actions/.github/workflows/lighthouse-ci.yml@v16
    with:
      build-command: npm run build
